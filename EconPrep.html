</style></head><body><aside><a href="#" class="brand"><b>e↗</b> EconPrep<span>.</span></a><div class="navlabel">YOUR PROGRAM</div><button class="program" id="program">▥ <span>ISI MSQE<small>Economics entrance</small></span><span>⌄</span></button><div class="navlabel">WORKSPACE</div><nav><button class="active" data-page="overview"><i>▦</i><span>Overview</span></button><button data-page="papers"><i>▤</i><span>Past year papers</span><em>27</em></button><button data-page="practice"><i>◷</i><span>Mock tests</span></button><button data-page="syllabus"><i>≡</i><span>Syllabus</span></button><button data-page="bookmarks"><i>♧</i><span>Bookmarks</span></button><button data-page="progress"><i>↗</i><span>My progress</span></button></nav><div class="sidebar-bottom"><div class="future"><label>COMING NEXT</label><div><span>GATE</span><span>JAM</span><span>CUET PG</span></div></div><div class="profile"><b>A</b><span>My workspace</span><i></i></div></div></aside><main><header><span>Workspace <em>/</em> <b id="crumb">Overview</b></span><div><span class="focus">● &nbsp; ISI MSQE Preparation</span><button id="help" aria-label="About this preview">?</button></div></header><div id="content"></div><footer><span>EconPrep · ISI MSQE Preparation</span><span>Demo preview</span></footer></main><dialog id="modal"><div id="modal-content"></div></dialog><div id="toast" role="status"></div><script>const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

const questions={PEA:[{topic:'Calculus',q:'Let f(x) = x³ − 3x. At which point does f have a local maximum?',options:['x = −1','x = 0','x = 1','x = 3'],answer:0,solution:'Differentiate: f′(x) = 3x² − 3 = 0 gives x = ±1. Since f″(x) = 6x, f″(−1) < 0. Therefore x = −1 is a local maximum.'},{topic:'Probability',q:'Two fair dice are rolled independently. What is the probability that their sum is 8?',options:['1/6','5/36','1/9','7/36'],answer:1,solution:'There are 36 equally likely ordered outcomes. The sum is 8 for (2,6), (3,5), (4,4), (5,3), and (6,2). The probability is 5/36.'},{topic:'Microeconomics',q:'A consumer has utility u(x, y) = xy, income 120, and prices pₓ = 2 and pᵧ = 3. What is the optimal quantity of x?',options:['20','30','40','60'],answer:1,solution:'For Cobb–Douglas utility xy, each good receives half the consumer’s income. Spending on x is 60, so x = 60/2 = 30. The corresponding y is 20.'}],PEB:[{topic:'Calculus',q:'Let f(x) = x³ − 3x on [−2, 2]. Find the global maximum and minimum values, and justify your answer.',solution:'The stationary points solve f′(x) = 3x² − 3 = 0, so x = −1 and x = 1. Compare values at these points and the endpoints: f(−2) = −2, f(−1) = 2, f(1) = −2, f(2) = 2. The global maximum is 2 (at −1 and 2) and the global minimum is −2 (at −2 and 1). Continuity on the closed interval guarantees that these extrema exist.'},{topic:'Microeconomics',q:'A consumer maximizes u(x, y) = xy subject to 2x + 3y ≤ 120 and x, y ≥ 0. Derive the optimal bundle and explain why it is a maximum.',solution:'Utility is increasing in both goods when x, y > 0, so the budget binds. Substitute y = (120 − 2x)/3, giving u(x) = 40x − (2/3)x² for 0 ≤ x ≤ 60. The first-order condition is 40 − (4/3)x = 0, so x = 30 and y = 20. The second derivative is −4/3 < 0, and the endpoints give zero utility. Thus the unique optimal bundle is (30, 20).'}]};

questions.PEB[0].hint='Find the stationary points using f′(x) = 0. Compare f at these points and at both endpoints.';

.join('')}</div></section><section class="syllabus-teaser"><span class="eyebrow">OFFICIAL 2026 SYLLABUS</span><h2>What to study</h2><p>Mathematics · Statistics<br>Microeconomics · Macroeconomics</p><button class="text-button" data-go="syllabus">View topics ↗</button></section></div>`}

function renderPapers(){const query=$('#search').value.trim();let years=Array.from({length:27},(_,i)=>2024-i).filter(y=>String(y).includes(query));if($('#sort').value==='old')years.reverse();const t=$('#paper-track').value;$('#paper-list').innerHTML=years.length?years.map(y=>`<article class="library-card"><span class="pill">${t} · ${t==='PEA'?'OBJECTIVE':'DESCRIPTIVE'}</span><h3>ISI MSQE ${y}</h3><p>Import pending</p><button class="btn outline" data-preview="${t}" data-paper-year="${y}">View paper ↗</button></article>`).join(''):'<div class="empty">No matching paper years.</div>'}
function practice(){return `${heading('Practice')}<div class="tabs"><button data-switch="PEA" class="${track==='PEA'?'active':''}">PEA · Objective</button><button data-switch="PEB" class="${track==='PEB'?'active':''}">PEB · Descriptive</button></div><section class="practice-intro"><span class="track-symbol">${track==='PEA'?'∑':'ƒ'}</span><h2>${track} sample practice</h2><p>${track==='PEA'?'3 questions · 10 minutes':'2 questions · Hints & solutions'}</p><button class="btn" id="start-demo">Start ${track} demo ↗</button></section><div class="notice">Original demo questions. ${track==='PEA'?'Demo scoring: +1 correct, 0 otherwise.':'Practice on paper; use hints when needed.'}</div><div class="section-head" style="margin-top:28px"><h2>Past year papers</h2><button class="text-button" data-go="papers">All years ↗</button></div><div class="paper-table">${[2024,2023,2022].map(paperRow).join('')}</div>`}

function navigate(next){if(test&&!test.done&&next!=='test'){modal(`<h2>Leave this practice session?</h2><p>Current practice will not be saved.</p><div class="dialog-actions"><button class="btn outline" data-close>Keep practicing</button><button class="btn" id="leave-session">Leave session</button></div>`);$('#leave-session').onclick=()=>{closeModal();clearInterval(tick);test=null;navigate(next)};return}page=next;$('#crumb').textContent=({overview:'Overview',papers:'Past year papers',practice:'Mock tests',bookmarks:'Bookmarks',progress:'My progress',syllabus:'Syllabus',test:'Practice session'})[next];$$('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===next||(next==='test'&&b.dataset.page==='practice')));$('#content').innerHTML=({overview,papers,practice,bookmarks:bookmarksPage,progress,syllabus})[next]?.()||'';if(next==='papers'){renderPapers();$('#search').oninput=renderPapers;$('#paper-track').value=track;renderPapers();$('#paper-track').onchange=()=>{track=$('#paper-track').value;renderPapers()};$('#sort').onchange=renderPapers}window.scrollTo(0,0)}

function start(t){closeModal();clearInterval(tick);test={track:t,index:0,answers:{},reviewed:{},tab:'question',end:Date.now()+600000,done:false};$('#crumb').textContent=`${t} practice`;$$('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='practice'));renderTest();window.scrollTo(0,0);if(t==='PEA')tick=setInterval(()=>{if(!test||test.done)return;const left=Math.max(0,Math.ceil((test.end-Date.now())/1000));if($('#timer'))$('#timer').textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(left===0){closeModal();finish()}},1000)}
function answered(i){return test.track==='PEB'?Boolean(test.reviewed[i]):test.answers[i]!==undefined}
function renderTest(){const t=test.track,i=test.index,q=questions[t][i],id=`${t}-${i}`,left=Math.max(0,Math.ceil((test.end-Date.now())/1000));$('#content').innerHTML=`${heading(`${t} practice`,'Sample questions')}<div class="test-heading"><span class="pill">${t==='PEA'?'OBJECTIVE':'DESCRIPTIVE'}</span>${t==='PEA'?`<span class="timer" id="timer">${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}</span>`:'<span class="self-review-label">Self-practice</span>'}</div><div class="test-layout"><article class="question-card"><div class="q-meta">${i+1} / ${questions[t].length} · ${q.topic}</div>${t==='PEA'?`<h2>${q.q}</h2>${q.options.map((o,j)=>`<label class="option ${test.answers[i]===j?'selected':''}"><input type="radio" name="answer" value="${j}" ${test.answers[i]===j?'checked':''}><span>${String.fromCharCode(65+j)}.</span> ${o}</label>`).join('')}`:`<div class="tabs question-tabs" role="tablist" aria-label="Question help">${['question','hint','solution'].map(tab=>`<button role="tab" id="tab-${tab}" aria-controls="question-panel" aria-selected="${test.tab===tab}" data-question-tab="${tab}" class="${test.tab===tab?'active':''}">${tab[0].toUpperCase()+tab.slice(1)}</button>`).join('')}</div><div id="question-panel" role="tabpanel" aria-labelledby="tab-${test.tab}">${test.tab==='question'?`<h2>${q.q}</h2>`:`<p class="question-context">${q.q}</p><div class="solution ${test.tab==='hint'?'hint-panel':''}"><b>${test.tab==='hint'?'Hint':'Worked solution'}</b><p>${test.tab==='hint'?q.hint:q.solution}</p></div>`}</div><button class="btn outline mark-practiced" id="mark-practiced" aria-pressed="${answered(i)}">${answered(i)?'✓ Practiced':'Mark as practiced'}</button>`}<div class="q-actions"><button class="btn outline" id="bookmark">${bookmarks.includes(id)?'✓ Saved':'♧ Save'}</button><div><button class="btn outline" id="prev" ${i===0?'disabled':''}>← Back</button> <button class="btn" id="next">${i===questions[t].length-1?(t==='PEA'?'Submit':'Finish'):'Next →'}</button></div></div></article><section class="test-side"><h3>Questions</h3><div class="palette">${questions[t].map((_,j)=>`<button aria-label="Question ${j+1}" data-question="${j}" class="${answered(j)?'answered':''} ${i===j?'current':''}">${j+1}</button>`).join('')}</div><button class="btn" id="submit">${t==='PEA'?'Submit test':'Finish practice'}</button></section></div>`;if(t==='PEA')$$('input[name="answer"]').forEach(el=>el.onchange=()=>{test.answers[i]=Number(el.value);renderTest()});else{$('#mark-practiced').onclick=()=>{test.reviewed[i]=!test.reviewed[i];renderTest()};$$('[data-question-tab]').forEach(b=>b.onclick=()=>{test.tab=b.dataset.questionTab;renderTest();$(`#tab-${test.tab}`).focus()})}$('#prev').onclick=()=>{if(test.index>0){test.index--;test.tab='question';renderTest()}};$('#next').onclick=()=>{if(i<questions[t].length-1){test.index++;test.tab='question';renderTest()}else confirmSubmit()};$('#submit').onclick=confirmSubmit;$('#bookmark').onclick=()=>{if(bookmarks.includes(id))bookmarks=bookmarks.filter(x=>x!==id);else bookmarks.push(id);save('econprep-bookmarks',bookmarks);renderTest()};$$('[data-question]').forEach(b=>b.onclick=()=>{test.index=Number(b.dataset.question);test.tab='question';renderTest()})}
function confirmSubmit(){const n=questions[test.track].filter((_,i)=>answered(i)).length;modal(`<h2>${test.track==='PEA'?'Submit test?':'Finish practice?'}</h2><p>${n} / ${questions[test.track].length} ${test.track==='PEA'?'answered':'marked as practiced'}.</p><div class="dialog-actions"><button class="btn outline" data-close>Continue</button><button class="btn" id="finish">${test.track==='PEA'?'Submit & review':'Finish & review'}</button></div>`);$('#finish').onclick=()=>{closeModal();finish()}}
function finish(){if(!test||test.done)return;clearInterval(tick);test.done=true;const t=test.track,qs=questions[t],score=t==='PEA'?qs.filter((q,i)=>test.answers[i]===q.answer).length:null;history.push({track:t,date:new Date().toISOString(),score,total:qs.length,answered:qs.filter((_,i)=>answered(i)).length});save('econprep-history',history);$('#content').innerHTML=`${heading(t==='PEA'?`${score} / ${qs.length} correct`:'Practice complete',t==='PEA'?'Demo scoring: +1 correct, 0 otherwise.':'PEB · Self-review')}<section class="result">${qs.map((q,i)=>`<div class="result-item"><span class="badge-result">${i+1} · ${q.topic}</span><h3>${q.q}</h3>${t==='PEA'?`<p>Your answer: <b>${test.answers[i]===undefined?'Skipped':safe(q.options[test.answers[i]])}</b> · Correct: <b>${safe(q.options[q.answer])}</b></p>`:`<p class="self-review-label">${answered(i)?'✓ Practiced':'Not marked as practiced'}</p><details><summary>Hint</summary><div class="solution hint-panel">${q.hint}</div></details>`}<details><summary>Worked solution</summary><div class="solution">${q.solution}</div></details><button class="text-button" data-save-question="${t}-${i}">${bookmarks.includes(`${t}-${i}`)?'✓ Saved':'♧ Save question'}</button></div>`).join('')}<div class="result-actions"><button class="btn" data-go="practice">Practice again ↗</button><button class="btn outline" data-go="progress">My progress</button></div></section>`;window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close'))closeModal();if(b.dataset.page)navigate(b.dataset.page);if(b.dataset.go)navigate(b.dataset.go);if(b.dataset.track){track=b.dataset.track;navigate('practice')}if(b.dataset.switch){track=b.dataset.switch;navigate('practice')}if(b.dataset.year)paperPreview(b.dataset.year);if(b.dataset.preview)paperPreview(b.dataset.paperYear,b.dataset.preview);if(b.dataset.launch)start(b.dataset.launch);if(b.dataset.remove){bookmarks=bookmarks.filter(x=>x!==b.dataset.remove);save('econprep-bookmarks',bookmarks);navigate('bookmarks')}if(b.dataset.saveQuestion){const id=b.dataset.saveQuestion;if(bookmarks.includes(id))bookmarks=bookmarks.filter(x=>x!==id);else bookmarks.push(id);save('econprep-bookmarks',bookmarks);b.textContent=bookmarks.includes(id)?'✓ Bookmarked':'♧ Bookmark question'}if(b.id==='start-demo')start(track);if(b.id==='help')modal(`<h2>A focused beginning.</h2><p>Independent ISI MSQE practice. Progress is saved in this browser.</p><p>Demo questions only; full paper import is pending. Not affiliated with ISI.</p><div class="dialog-actions"><button class="btn" data-close>Got it</button></div>`);if(b.id==='pattern')modal(`<h2>Two tracks, one journey.</h2><p><b>PEA</b> provides a multiple-choice practice interface with answer selection, navigation, and scoring.</p><p><b>PEB</b> provides questions, hints and solutions for practice on paper.</p><p>The demo uses a 10-minute timer. Full exam instructions and marking schemes will be configured separately for each imported paper.</p><div class="dialog-actions"><button class="btn" data-close>Explore the tracks</button></div>`);if(b.id==='program')modal(`<h2>Start with ISI MSQE.</h2><p>Your current workspace is dedicated to ISI MSQE. GATE, JAM, and CUET PG will have their own preparation spaces in future releases.</p><div class="dialog-actions"><button class="btn" data-close>Back to ISI MSQE</button></div>`)});
$$('nav button').forEach(b=>b.setAttribute('aria-label',b.querySelector('span').textContent));
$('.brand').onclick=e=>{e.preventDefault();navigate('overview')};window.addEventListener('beforeunload',e=>{if(test&&!test.done){e.preventDefault();e.returnValue=''}});navigate('overview');
</script></body></html>
