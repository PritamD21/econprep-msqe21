<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img"><rect width="760" height="480" fill="#fff"/><title>Short-run IS–LM responses and medium-run investment comparison</title><text x="30" y="30" fill="#29382e" font-size="22" font-family="Arial,sans-serif">IS–LM: short run and medium run</text><text x="55" y="70" fill="#29382e" font-size="16" font-family="Arial,sans-serif">Monetary expansion</text><line x1="55" y1="360" x2="335" y2="360" stroke="#718265" stroke-width="3" stroke-dasharray=""/><line x1="55" y1="360" x2="55" y2="110" stroke="#718265" stroke-width="3" stroke-dasharray=""/><text x="325" y="385" fill="#29382e" font-size="16" font-family="Arial,sans-serif">Y</text><text x="35" y="115" fill="#29382e" font-size="16" font-family="Arial,sans-serif">i</text><line x1="75" y1="140" x2="315" y2="320" stroke="#184e3d" stroke-width="3" stroke-dasharray=""/><line x1="75" y1="330" x2="315" y2="150" stroke="#8c997d" stroke-width="3" stroke-dasharray=""/><line x1="75" y1="360" x2="335" y2="165" stroke="#a17a3d" stroke-width="3" stroke-dasharray=""/><text x="210" y="290" fill="#a17a3d" font-size="16" font-family="Arial,sans-serif">LM →</text><text x="175" y="130" fill="#184e3d" font-size="16" font-family="Arial,sans-serif">IS</text><text x="275" y="140" fill="#8c997d" font-size="16" font-family="Arial,sans-serif">LM</text><text x="430" y="70" fill="#29382e" font-size="16" font-family="Arial,sans-serif">Fiscal expansion</text><line x1="430" y1="360" x2="710" y2="360" stroke="#718265" stroke-width="3" stroke-dasharray=""/><line x1="430" y1="360" x2="430" y2="110" stroke="#718265" stroke-width="3" stroke-dasharray=""/><text x="700" y="385" fill="#29382e" font-size="16" font-family="Arial,sans-serif">Y</text><text x="410" y="115" fill="#29382e" font-size="16" font-family="Arial,sans-serif">i</text><line x1="450" y1="140" x2="690" y2="320" stroke="#184e3d" stroke-width="3" stroke-dasharray=""/><line x1="450" y1="330" x2="690" y2="150" stroke="#8c997d" stroke-width="3" stroke-dasharray=""/><line x1="485" y1="115" x2="715" y2="285" stroke="#a17a3d" stroke-width="3" stroke-dasharray=""/><text x="630" y="265" fill="#a17a3d" font-size="16" font-family="Arial,sans-serif">IS →</text><text x="550" y="130" fill="#184e3d" font-size="16" font-family="Arial,sans-serif">IS</text><text x="650" y="140" fill="#8c997d" font-size="16" font-family="Arial,sans-serif">LM</text><text x="35" y="410" fill="#29382e" font-size="16" font-family="Arial,sans-serif">Short run: Y ↑, i ↓, I ↑</text><text x="410" y="410" fill="#29382e" font-size="16" font-family="Arial,sans-serif">Short run: Y ↑, i ↑, I ambiguous</text><text x="35" y="445" fill="#29382e" font-size="16" font-family="Arial,sans-serif">Medium run: Y, i and I unchanged</text><text x="410" y="445" fill="#29382e" font-size="16" font-family="Arial,sans-serif">Medium run: Y unchanged, i ↑, I ↓</text><text x="35" y="473" fill="#29382e" font-size="14" font-family="Arial,sans-serif">Schematic shifts; medium run assumes unchanged potential output.</text></svg>